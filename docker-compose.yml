services:
  gondesk-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: gondesk:latest
    container_name: gondesk-bridge
    restart: unless-stopped
    ports:
      # Single Port for HTTPS API, WSS Signaling, TURNS (TCP/TLS), and TURN/STUN (UDP)
      - "8443:8443/tcp"
      - "8443:8443/udp"
    environment:
      - PORT=${PORT:-8443}
    volumes:
      - gondesk_data:/data

volumes:
  gondesk_data:

